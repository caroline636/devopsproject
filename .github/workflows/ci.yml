name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install flake8 black

    - name: Lint with flake8
      run: |
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format with black
      run: black --check --diff app/

    - name: Run tests
      run: python test_script.py

  build-and-deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to server
      run: |
        echo "Deploying via Git..."
        # Example: ssh user@server 'cd /path/to/app && git pull origin main && pip install -r requirements.txt && systemctl restart app'
        # Replace with actual deployment script or commands

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/resume-screening:latest

    - name: Deploy to production
      run: |
        echo "Deployment triggered. Add deployment steps here (e.g., trigger Ansible playbook or update cloud infrastructure)."
        # Example: curl -X POST -H "Authorization: token ${{ secrets.DEPLOY_TOKEN }}" https://api.example.com/deploy
