<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2>Screening Result for {{ result.filename }}</h2>
    <p><strong>Score:</strong> {{ '%.3f' | format(result.score) }} (cosine similarity)</p>
    <p><strong>Top keyword matches:</strong> {{ result.matches | join(', ') }}</p>
    <hr/>
    <h5>Job Description</h5>
    <pre>{{ jd }}</pre>
    <hr/>
    <h5>Extracted Resume Text (truncated)</h5>
    <pre style="white-space: pre-wrap; max-height: 300px; overflow: auto;">{{ resume_text[:5000] }}</pre>
    <a href="/" class="btn btn-secondary mt-3">Back</a>
  </div>
</body>
</html>
